version: '3.8'
services:
  datadog:
    container_name: wabi-sabi-datadog
    image: datadog/agent:latest
    env_file:
      - ./env/app.env
    ports:
      - "8125:8125/udp" 
      - "8126:8126/tcp"  
    volumes:
    - /var/run/docker.sock:/var/run/docker.sock:ro
    - /proc/:/host/proc/:ro
    - /sys/fs/cgroup/:/host/sys/fs/cgroup:ro
    networks:
      - dd-net

  api:
    container_name: wabi-sabi-api
    build: ./api
    command: ddtrace-run uvicorn main:app --host 0.0.0.0 --port 8000
    env_file:
      - ./env/app.env
    volumes:
      - scan-db:/app/data
    depends_on:
      - datadog
    ports:
      - "8000:8000"
    networks:
      - dd-net
  
  frontend:
    container_name: wabi-sabi-frontend
    command : cp -a /app/. /frontend/
    build: ./frontend
    env_file:
      - ./env/app.env
    depends_on:
      - api
    networks:
      - dd-net
    volumes:
      - ./frontend-build:/frontend

  nginx:
    container_name: wabi-sabi-nginx
    build: ./nginx/local
    ports:
      - "8001:80"
    depends_on:
      - api
    networks:
      - dd-net
    volumes:
      - ./frontend-build:/app
  
networks:
  dd-net:
    driver: bridge

volumes:
  scan-db: